[build-system]
requires = []
build-backend = "handouter_build"
backend-path = ["."]

[project]
name = "handouter"
version = "0.2.0"
description = "Local-first lecture material preparation and Agent handoff"
requires-python = ">=3.11"
dependencies = [
  "windows-curses>=2.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
html = ["markdown-it-py>=3,<5", "mdit-py-plugins>=0.4,<1", "latex2mathml>=3,<4"]
asr = [
  "funasr>=1.4,<2",
  "torch>=2",
  "torchaudio>=2",
]
tui = [
  "windows-curses>=2.4; sys_platform == 'win32'",
]
all = [
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.4,<1",
  "latex2mathml>=3,<4",
  "funasr>=1.4,<2",
  "torch>=2",
  "torchaudio>=2",
]

[project.scripts]
handouter = "handouter.cli:main"

